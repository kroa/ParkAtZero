name: Deploy to Cloudflare Pages

# GitHub 연동(Cloudflare Pages > Git integration)을 쓰면 이 워크플로우는 필요 없다.
# 빌드 환경을 직접 통제하고 싶거나, CI 통과 후에만 배포하고 싶을 때 사용한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 빌드 & 배포
    runs-on: ubuntu-latest
    timeout-minutes: 12

    # Cloudflare 자격증명이 없는 포크에서는 조용히 건너뛴다.
    if: ${{ github.repository_owner != '' }}

    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: 프로덕션 빌드
        run: npm run build:only
        env:
          # 공개해도 되는 값만 여기에 둔다. 인증키는 Pages Functions 환경변수로 주입한다.
          VITE_PARKING_SEED_URL: /data/parkings.sample.json
          VITE_PARKING_API_PROXY: /api/parkings
          VITE_ADS_ENABLED: ${{ vars.VITE_ADS_ENABLED || 'false' }}
          VITE_EZOIC_PLACEHOLDER_LIST: ${{ vars.VITE_EZOIC_PLACEHOLDER_LIST || '101' }}
          VITE_EZOIC_PLACEHOLDER_BOTTOM: ${{ vars.VITE_EZOIC_PLACEHOLDER_BOTTOM || '102' }}

      - name: Cloudflare Pages 배포
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # functions/ 디렉터리는 wrangler 가 자동으로 인식해 Pages Functions 로 배포한다.
          command: pages deploy dist --project-name=parkatzero --branch=main
