name: Deploy to Cloudflare Pages

# main 에 push 될 때, 그리고 데이터 갱신 워크플로우가 호출할 때 배포한다.
#
# Cloudflare Pages 의 Git 연동을 쓰는 경우에는 이 워크플로우가 필요 없다.
# 이 프로젝트는 wrangler 직접 업로드(Direct Upload) 방식이라 여기서 배포한다.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # refresh-data.yml 이 데이터 갱신 커밋 뒤에 직접 호출한다.
  # GITHUB_TOKEN 으로 만든 push 는 다른 워크플로우를 트리거하지 못하기 때문이다.
  workflow_call:

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 빌드 & 배포
    runs-on: ubuntu-latest
    timeout-minutes: 12

    # 소스를 읽어 빌드하는 것 외에는 아무 권한도 필요 없다.
    # 재사용 워크플로우는 호출자보다 큰 권한을 가질 수 없으므로 최소로 유지한다.
    permissions:
      contents: read

    steps:
      # 자격증명이 없으면 실패가 아니라 건너뛴다.
      # 포크나 시크릿 설정 전 저장소에서 빨간 X 만 쌓이는 것을 막는다.
      - name: Cloudflare 자격증명 확인
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 가 없어 배포를 건너뜁니다. (DEPLOY.md 8절)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.cf.outputs.ready == 'true'

      - uses: actions/setup-node@v5
        if: steps.cf.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
        if: steps.cf.outputs.ready == 'true'

      - name: 프로덕션 빌드
        if: steps.cf.outputs.ready == 'true'
        env:
          # 공개해도 되는 값만. 인증키는 여기 오지 않는다 —
          # 앱은 정적 스냅샷만 읽고 런타임에 공공 API 를 호출하지 않는다.
          VITE_PARKING_DATA_URL: /data/parkings.full.json
          VITE_PARKING_SEED_URL: /data/parkings.sample.json
          VITE_ADS_ENABLED: ${{ vars.VITE_ADS_ENABLED || 'false' }}
          VITE_EZOIC_PLACEHOLDER_LIST: ${{ vars.VITE_EZOIC_PLACEHOLDER_LIST || '101' }}
          VITE_EZOIC_PLACEHOLDER_BOTTOM: ${{ vars.VITE_EZOIC_PLACEHOLDER_BOTTOM || '102' }}
        run: npm run build:only

      - name: Cloudflare Pages 배포
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # functions/ 디렉터리는 wrangler 가 자동으로 인식해 Pages Functions 로 배포한다.
          command: pages deploy dist --project-name=parkatzero --branch=main
