name: 주차장 데이터 자동 갱신

# ─────────────────────────────────────────────────────────────
#  전국주차장정보표준데이터를 월 1회 받아 스냅샷으로 굽고, 바뀐 게 있으면 커밋한다.
#  그 커밋이 deploy 워크플로우를 태워 사용자에게 새 데이터가 나간다.
#
#  왜 런타임 API 호출이 아니라 이 방식인가
#   - 원본 갱신주기가 '반기'라 실시간성이 의미가 없다.
#   - 개발계정 일일 트래픽은 10,000회. 사용자 트래픽이 그 한도를 먹으면
#     화면이 먼저 죽는다. 이 방식은 한 달에 수십 회만 쓴다.
#   - 정적 파일이라 엣지 캐시 + 브라우저 캐시가 그대로 먹힌다.
#
#  필요한 Secrets (Settings → Secrets and variables → Actions)
#   PARKING_API_KEY   공공데이터포털 일반 인증키(Decoding)
#   PARKING_API_BASE  https://api.odcloud.kr/api/15012896/v1/uddi:<UUID>
# ─────────────────────────────────────────────────────────────

on:
  schedule:
    # 매월 1일 03:00 KST (UTC 18:00 전날). 갱신주기가 반기라 월 1회로 충분하다.
    - cron: '0 18 1 * *'
  workflow_dispatch:

# 워크플로우 수준 기본 권한. 재사용 워크플로우를 호출하는 deploy 잡도 이 범위 안에서 움직인다.
permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    name: 스냅샷 갱신
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: write

    outputs:
      changed: ${{ steps.diff.outputs.changed }}

    steps:
      - name: 인증키 확인
        env:
          KEY: ${{ secrets.PARKING_API_KEY }}
          BASE: ${{ secrets.PARKING_API_BASE }}
        run: |
          if [ -z "$KEY" ] || [ -z "$BASE" ]; then
            echo "::error::PARKING_API_KEY / PARKING_API_BASE 시크릿이 없습니다. DEPLOY.md 4절 참고."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # 출력을 파일로도 남긴다. 실패하면 아래 단계가 그 내용을 실행 요약 화면에 붙여
      # 단계를 하나씩 펼쳐 보지 않아도 원인이 바로 보이게 한다.
      - name: 데이터 수집
        env:
          PARKING_API_KEY: ${{ secrets.PARKING_API_KEY }}
          PARKING_API_BASE: ${{ secrets.PARKING_API_BASE }}
        run: |
          set -o pipefail
          npm run data:fetch 2>&1 | tee /tmp/step.log

      # 한강공원 주차장 30곳은 표준데이터에 한 곳도 올라 있지 않아 따로 받는다.
      # 인증키가 없으면 실패가 아니라 건너뛴다 — 이 갱신은 표준데이터가 본체다.
      - name: 한강공원 주차장 수집
        env:
          SEOUL_OPENAPI_KEY: ${{ secrets.SEOUL_OPENAPI_KEY }}
        run: |
          set -o pipefail
          if [ -z "$SEOUL_OPENAPI_KEY" ]; then
            echo "::notice::SEOUL_OPENAPI_KEY 가 없어 한강공원 수집을 건너뜁니다."
            exit 0
          fi
          npm run data:hangang 2>&1 | tee /tmp/step.log

      # 이마트·트레이더스 154곳. 대형마트 부설주차장도 표준데이터에 없다.
      # 점포 안내 페이지를 훑는 것이라 실패해도 갱신 전체를 세우지 않는다.
      - name: 이마트 주차 정보 수집
        continue-on-error: true
        run: |
          set -o pipefail
          npm run data:emart 2>&1 | tee /tmp/step.log

      # 현대백화점그룹 아울렛·백화점 22곳.
      - name: 아울렛 주차 정보 수집
        continue-on-error: true
        run: |
          set -o pipefail
          npm run data:outlets 2>&1 | tee /tmp/step.log

      # 스냅샷이 실제로 앱에서 동작하는지 확인한 뒤에만 커밋한다.
      # 원본 스키마가 바뀌었는데 그대로 밀어 넣으면 서비스가 빈 목록이 된다.
      - name: 스냅샷 검증
        run: |
          set -o pipefail
          node scripts/verify-snapshot.mjs public/data/parkings.full.json 2>&1 | tee /tmp/step.log

      - name: 실패 원인 요약
        if: failure()
        run: |
          {
            echo "### ❌ 실패"
            echo ""
            echo '```'
            tail -n 40 /tmp/step.log 2>/dev/null || echo "(수집 단계 이전에 멈췄습니다)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 먼저 스테이징해야 '아직 추적되지 않는 새 파일'도 변경으로 잡힌다.
      # git diff 만으로는 untracked 파일이 보이지 않아 최초 실행이 조용히 아무것도 안 한다.
      - name: 변경 여부 판단
        id: diff
        run: |
          git add public/data/parkings.full.json
          if git diff --cached --quiet -- public/data/parkings.full.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "원본에 변화가 없습니다. 커밋을 건너뜁니다."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat -- public/data/parkings.full.json
          fi

      - name: 커밋 & 푸시
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          COUNT=$(node -p "require('./public/data/parkings.full.json').totalCount")
          git commit -m "chore(data): 주차장 스냅샷 갱신 (${COUNT}건)" \
                     -m "출처: 공공데이터포털 전국주차장정보표준데이터 (공공누리 제1유형)" \
                     -m "refresh-data 워크플로우가 자동 생성한 커밋입니다."
          git push


      - name: 요약
        run: |
          {
            echo "### 주차장 스냅샷"
            echo ""
            echo "- 건수: $(node -p "require('./public/data/parkings.full.json').totalCount.toLocaleString('ko-KR')")"
            echo "- 크기: $(du -h public/data/parkings.full.json | cut -f1)"
            echo "- 변경: ${{ steps.diff.outputs.changed }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # GITHUB_TOKEN 으로 만든 push 는 다른 워크플로우를 트리거하지 않는다(무한루프 방지 규칙).
  # 그래서 갱신 커밋이 배포로 이어지려면 여기서 배포 워크플로우를 직접 불러야 한다.
  deploy:
    name: 배포
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
