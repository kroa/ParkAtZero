<!doctype html>
<html lang="ko" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />

    <title>ParkAtZero · 0원 주차 — 지금 무료로 댈 수 있는 주차장</title>
    <meta
      name="description"
      content="방문할 날짜와 시간을 고르면 그 시간에 '0원'으로 주차할 수 있는 주차장만 골라 보여줍니다. 회원가입 없이 1초 만에."
    />
    <!--
      Google Search Console 소유권 확인(URL 접두어 속성).
      pages.dev 는 공개 접미사 목록에 있어 DNS 확인을 쓸 수 없으므로 이 태그로 증명한다.
      공개되는 값이며 비밀이 아니다. 지우면 소유권 확인이 풀린다.
    -->
    <meta name="google-site-verification" content="q_tK5fhWjYZN1cLFRjBcbVXrrMKRO0dJPEY9ISctfK4" />

    <!--
      네이버 서치어드바이저 소유권 확인.
      한국 서비스라 네이버 유입이 구글만큼 크므로 양쪽 다 등록한다.
      색인 제출 자체는 IndexNow 로 이미 하고 있고(네이버가 참여사다),
      이 등록은 수집·노출 현황을 들여다보기 위한 것이다.
    -->
    <meta name="naver-site-verification" content="bde2abfa22c2680701bfff43a3443d001c5bd295" />

    <meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://parkatzero.pages.dev/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ParkAtZero" />
    <meta property="og:title" content="ParkAtZero · 0원 주차" />
    <meta property="og:description" content="선택한 방문 시간에 무료인 주차장만 초록으로 보여줍니다." />
    <meta property="og:url" content="https://parkatzero.pages.dev/" />
    <meta property="og:image" content="https://parkatzero.pages.dev/og.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Pretendard: 한글 가독성이 가장 좋은 모던 산세리프. 실패해도 시스템 폰트로 자연스럽게 폴백된다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />

    <script>
      // FOUC 방지: 첫 페인트 전에 테마 클래스를 확정한다.
      ;(function () {
        try {
          var stored = localStorage.getItem('pz.theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = stored ? stored === 'dark' : prefersDark
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* private mode 등에서 localStorage 접근 실패 — 기본값 유지 */
        }
      })()
    </script>

    <!--
      구조화 데이터.
      이 페이지는 자바스크립트로 그려지는 앱이라 크롤러가 보는 본문이 거의 없다.
      무엇을 하는 사이트인지와 지역별 목록으로 가는 길을 여기서 알려 준다.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "0원 주차 (ParkAtZero)",
        "url": "https://parkatzero.pages.dev/",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "Web",
        "inLanguage": "ko-KR",
        "description": "방문할 날짜와 시간을 고르면 그 시간에 0원으로 주차할 수 있는 주차장만 골라 보여줍니다.",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "KRW" },
        "areaServed": { "@type": "Country", "name": "대한민국" },
        "hasPart": {
          "@type": "WebPage",
          "name": "지역별 무료 주차장",
          "url": "https://parkatzero.pages.dev/%EC%A7%80%EC%97%AD/"
        }
      }
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <!--
      자바스크립트가 없으면 지도와 시간 판별을 쓸 수 없다. 그래도 빈 화면을 주지는 않는다 —
      지역별 목록은 빌드 때 만들어 둔 정적 페이지라 자바스크립트 없이도 그대로 열린다.
      크롤러가 보는 본문도 여기뿐이라, 지역 페이지로 가는 길을 여기서 열어 준다.
    -->
    <noscript>
      <div style="padding: 24px; font-family: system-ui; line-height: 1.7">
        <h1 style="font-size: 20px; margin: 0 0 8px">0원 주차</h1>
        <p style="margin: 0 0 12px">
          지도와 시간별 판별에는 JavaScript 가 필요합니다. 브라우저 설정에서 켜주세요.
        </p>
        <p style="margin: 0">
          JavaScript 없이도 <a href="/지역/">지역별 무료 주차장 목록</a>은 바로 보실 수 있습니다.
          전국 시·군·구별로 요금을 받지 않는 주차장의 이름·주소·무료 조건·운영시간을 정리해 두었습니다.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
